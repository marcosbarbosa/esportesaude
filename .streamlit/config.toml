# ==============================================================================
# ⚙️ ARQUIVO: .streamlit/config.toml
# 🎯 FUNÇÃO: Configurações de Servidor (Sem forçar temas para permitir a troca dinâmica)
# ==============================================================================

[server]
headless = true
address = "0.0.0.0"
port = 8000
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
maxUploadSize = 200
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = false
