# ==============================================================================
# ⚙️ ARQUIVO: .streamlit/config.toml
# 🎯 FUNÇÃO: Configurações de Servidor (Sem forçar temas para permitir a troca dinâmica)
# ==============================================================================

[server]
headless = true
address = "0.0.0.0"
port = 8000
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
maxUploadSize = 200
# Evita que o app reaja a alterações de arquivo (cada atualização/merge fazia o
# Streamlit recarregar e derrubar a conexão, mostrando "running" e congelando a
# primeira tela). As mudanças passam a valer após reiniciar o app.
fileWatcherType = "none"
runOnSave = false

[browser]
serverAddress = "8859dbcc-e36e-4d16-8217-c288d14b7b73-00-3ce8mxj6fzww0.riker.replit.dev"
serverPort = 8000
gatherUsageStats = false